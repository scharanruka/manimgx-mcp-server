name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.x"
          python-version: "3.14"
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvulkan1 mesa-vulkan-drivers libgl1

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q -m "not slow"

      - name: Connection smoke test
        run: uv run python scripts/check_connection.py

      - name: Build distributions
        run: uv build

      - name: Wheel startup smoke test
        run: timeout 20 uvx --from dist/*.whl manimgx-mcp </dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
